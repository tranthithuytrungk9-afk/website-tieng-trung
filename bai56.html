<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bài 56 · 山这么高，你爬得上去吗</title><style>:root{font-family:system-ui,"Segoe UI",sans-serif;color:#21372d;background:#f5f8f5}*{box-sizing:border-box}body{margin:0}header{background:linear-gradient(115deg,#e2f3e8,#e8f1fc);padding:30px 16px}main,.wrap{max-width:860px;margin:auto;padding:0 16px}main{padding-top:20px;padding-bottom:50px}h1{font-size:clamp(24px,4vw,36px)}.card{background:#fff;border:1px solid #dbe6dd;border-radius:16px;padding:20px;margin:14px 0;box-shadow:0 2px 9px #142b1908}.muted{color:#62766a}.btn{display:inline-block;background:#327957;color:#fff;border:0;border-radius:10px;padding:12px 18px;font:inherit;font-weight:650;cursor:pointer;text-decoration:none;margin:5px}.btn.secondary{background:#fff;color:#327957;border:1px solid #a9c7b5}.btn:disabled{opacity:.55}.row{display:flex;gap:12px;flex-wrap:wrap}.option{display:block;border:1px solid #dce6df;border-radius:9px;padding:9px 12px;margin:7px 0;cursor:pointer}.option input{margin-right:10px}input[type=text]{width:100%;padding:12px;border:1px solid #c5d8ca;border-radius:9px;font:inherit;margin-top:6px}.q{white-space:pre-wrap;font-size:18px;line-height:1.7}.tag{color:#286847;background:#e8f3eb;padding:3px 9px;border-radius:30px;font-size:13px}.feedback{padding:12px;border-radius:9px;background:#f4f6f4;white-space:pre-wrap;margin-top:12px}.feedback.good{background:#e4f5e9}.feedback.bad{background:#fff0ed}.hidden{display:none}select{font:inherit;padding:11px;border:1px solid #bdd3c3;border-radius:9px}label{font-weight:600}#status{font-weight:600}.bar{height:8px;border-radius:10px;background:#e1eae4;overflow:hidden}.bar>div{height:100%;width:0;background:#327957;transition:width .2s}</style></head><body><header><div class="wrap"><a href="index.html">← Trang chủ</a><h1>第五十一课 · 山这么高，你爬得上去吗</h1><p>5 đề luyện tập · 25 câu/đề · HSK4–5</p></div></header><main><section class="card"><label for="set">Chọn đề</label><p><select id="set"><option value="1">Đề 1</option><option value="2">Đề 2</option><option value="3">Đề 3</option><option value="4">Đề 4</option><option value="5">Đề 5</option></select></p><label for="name">Họ tên học sinh</label><input type="text" id="name" maxlength="80" placeholder="Nguyễn Văn An"><p><label for="class">Lớp</label><input type="text" id="class" maxlength="40" placeholder="HSK4 - Lớp A"></p><p class="muted">Điền đúng họ tên và lớp để giáo viên xem kết quả.</p></section><div class="row"><strong id="progress">Đã trả lời: 0/25</strong><span class="muted">Mỗi câu đúng: 4 điểm</span></div><div class="bar"><div id="bar"></div></div><div id="questions"></div><div class="row"><button id="submit" class="btn" type="button">Nộp bài và lưu điểm</button><button id="reset" class="btn secondary" type="button">Làm lại</button></div><p id="status" role="status" aria-live="polite"></p><section id="result" class="card hidden"><h2>Kết quả</h2><h1 id="score"></h1><p id="summary"></p><p id="saved"></p></section><p class="muted">Đề luyện tập biên soạn bổ sung, không phải câu hỏi chính thức của giáo trình. Điểm được chấm trên máy chủ.</p></main><script>
const $=id=>document.getElementById(id);let questions=[];let submitted=false;
function progress(){let n=readAnswers().filter(Boolean).length;$('progress').textContent=`Đã trả lời: ${n}/${questions.length}`;$('bar').style.width=(questions.length?n/questions.length*100:0)+'%'}
function readAnswers(){return questions.map((q,i)=>{if(q.type==='mc'||q.type==='reading'){const checked=document.querySelector(`input[name="q${i}"]:checked`);return checked?checked.value:''}return ($('q'+i)?.value||'').trim()})}
function draw(){const box=$('questions');box.replaceChildren();questions.forEach((q,i)=>{const card=document.createElement('section');card.className='card';const tag=document.createElement('span');tag.className='tag';tag.textContent=q.tag||q.type;card.append(tag);const h=document.createElement('h2');h.textContent=`Câu ${i+1}`;card.append(h);const p=document.createElement('div');p.className='q';p.textContent=q.question;card.append(p);if(q.type==='mc'||q.type==='reading'){(q.options||[]).forEach((option,j)=>{const label=document.createElement('label');label.className='option';const input=document.createElement('input');input.type='radio';input.name='q'+i;input.value='abcd'[j];label.append(input,document.createTextNode(option));card.append(label)})}else{const input=document.createElement('input');input.type='text';input.id='q'+i;input.maxLength=500;input.placeholder=q.type==='order'?'Nhập câu chữ Hán hoàn chỉnh':'Nhập chữ Hán';card.append(input)}const feedback=document.createElement('div');feedback.className='feedback hidden';feedback.id='f'+i;card.append(feedback);box.append(card)});progress()}
async function load(){submitted=false;$('submit').disabled=true;$('status').textContent='Đang tải đề...';$('result').classList.add('hidden');try{const res=await fetch(`data/bai56-de${$('set').value}.json`,{cache:'no-store'});if(!res.ok)throw Error('Không tải được nội dung đề.');const d=await res.json();questions=d.questions;draw();$('status').textContent='';$('submit').disabled=false}catch(e){$('questions').replaceChildren();questions=[];$('status').textContent=e.message}}
$('set').addEventListener('change',load);$('questions').addEventListener('input',progress);$('questions').addEventListener('change',progress);
$('reset').onclick=()=>{if(confirm('Làm lại đề này?'))load()};
$('submit').onclick=async()=>{if(submitted){$('status').textContent='Đề này đã được nộp. Hãy chọn đề khác hoặc nhấn Làm lại.';return}const ten=$('name').value.trim(),lop=$('class').value.trim();if(!ten||!lop){$('status').textContent='Vui lòng nhập họ tên và lớp.';window.scrollTo({top:0,behavior:'smooth'});return}const answers=readAnswers();if(answers.some(a=>!a)&&!confirm('Bạn chưa trả lời hết. Vẫn nộp bài?'))return;const set=Number($('set').value);$('submit').disabled=true;$('set').disabled=true;$('status').textContent='Đang chấm và lưu điểm...';try{const res=await fetch('/.netlify/functions/nop-bai',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({ten_hoc_sinh:ten,lop,bai_hoc:'Bài 56',so_de:set,answers})});const data=await res.json().catch(()=>({error:'Phản hồi không hợp lệ'}));if(!res.ok||!data.saved)throw Error(data.error||'Không lưu được điểm');if(!Array.isArray(data.details)||data.details.length!==questions.length)throw Error('Dữ liệu chấm bài không đầy đủ');submitted=true;data.details.forEach((d,i)=>{const f=$('f'+i);f.className='feedback '+(d.correct?'good':'bad');f.textContent=(d.correct?'✓ Chính xác':'✗ Chưa chính xác')+'\nĐáp án: '+d.answer+'\nGiải thích: '+d.explain});$('score').textContent=data.score+'/100 điểm';$('summary').textContent=`Đúng ${data.correctCount}/${questions.length} câu · Chưa trả lời ${data.emptyCount} câu · Đề ${set}`;$('saved').textContent='Đã lưu kết quả. Mã lượt nộp: '+data.recordId;$('result').classList.remove('hidden');$('status').textContent='Nộp bài thành công.';$('result').scrollIntoView({behavior:'smooth'})}catch(e){$('status').textContent='Chưa xác nhận lưu điểm: '+e.message+'; vui lòng kiểm tra với giáo viên trước khi nộp lại.';$('submit').disabled=false}finally{$('set').disabled=false}};
load();</script><script src="/ve-trang-chu.js"></script>
</body></html>
